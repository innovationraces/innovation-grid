<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>

<style>

/* ---- style.css ---- */
/* ==========================================================
   Innovation Grid — Design tokens (professional / enterprise SaaS)
   Palette: Slate Ink / near-white Paper / Corporate Blue / Teal / Indigo
   Type: IBM Plex Sans Arabic throughout (display + body), IBM Plex Mono for data
   ========================================================== */

:root{
  --ink:      #0F172A;
  --ink-2:    #1E293B;
  --paper:    #FFFFFF;
  --paper-2:  #F4F6F9;
  --gold:     #2563EB;   /* primary brand blue */
  --gold-2:   #1D4ED8;   /* primary blue, darker */
  --teal:     #0E9384;
  --teal-2:   #0C7A6B;
  --violet:   #4F46E5;
  --slate:    #475467;
  --slate-2:  #94A3B8;
  --line:     #E2E8F0;
  --line-dark:rgba(248,250,252,0.14);

  --font-display: 'IBM Plex Sans Arabic', sans-serif;
  --font-body: 'IBM Plex Sans Arabic', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;

  --radius: 10px;
  --wrap: 1180px;
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img{ max-width:100%; display:block; }
a{ color: inherit; text-decoration:none; }
ul{ margin:0; padding:0; list-style:none; }

.wrap{
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 0 28px;
}

h1,h2,h3{
  font-family: var(--font-display);
  font-weight: 600;
  line-height: 1.15;
  margin: 0 0 .5em;
}

.eyebrow{
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: .04em;
  color: var(--gold-2);
  text-transform: uppercase;
  margin: 0 0 12px;
}
.eyebrow.center{ text-align:center; }
.section-title{ font-size: clamp(26px, 3.4vw, 40px); }
.section-title.center{ text-align:center; max-width: 640px; margin-inline:auto; margin-bottom: 52px; }

.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding: 12px 22px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 14.5px;
  border: 1px solid transparent;
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  white-space: nowrap;
}
.btn-solid{
  background: var(--ink);
  color: var(--paper);
}
.btn-solid:hover{ transform: translateY(-2px); box-shadow: 0 10px 24px rgba(11,18,38,.22); }
.btn-ghost{
  background: transparent;
  color: var(--ink);
  border-color: var(--line);
}
.btn-ghost:hover{ background: var(--paper-2); }
.btn-text{ font-weight:600; color: var(--teal-2); }
.btn-lg{ padding: 14px 28px; font-size: 15.5px; }

/* ---------- Header ---------- */
.site-header{
  position: sticky; top:0; z-index: 50;
  background: rgba(247,245,239,.86);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.header-inner{
  display:flex; align-items:center; justify-content:space-between;
  height: 76px;
  gap: 24px;
}
.brand{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
.brand-mark circle{ animation: brandPulse 2.4s ease-in-out infinite; }
.brand-mark circle:nth-child(2){ animation-delay:.25s; }
.brand-mark circle:nth-child(3){ animation-delay:.5s; }
@keyframes brandPulse{
  0%, 100%{ opacity:1; }
  50%{ opacity:.5; }
}
@media (prefers-reduced-motion: reduce){
  .brand-mark circle{ animation:none; }
}
.brand-name{
  font-family: var(--font-display);
  font-size: 20px; font-weight:600;
  letter-spacing: -.01em;
}
.brand-accent{ color: var(--teal); }

.main-nav{ display:flex; gap: 28px; }
.main-nav a{ font-size: 14.5px; font-weight:500; color: var(--slate); }
.main-nav a:hover{ color: var(--ink); }

.header-actions{ display:flex; align-items:center; gap: 12px; }

.nav-toggle{
  display:none;
  flex-direction:column; gap:5px;
  background:none; border:none; cursor:pointer; padding:6px;
}
.nav-toggle span{ width:22px; height:2px; background: var(--ink); display:block; }

/* ---------- Hero ---------- */
.hero{ padding: 76px 0 40px; overflow: hidden; }
.hero-inner{
  display:block;
  max-width: 720px;
}
.hero h1{
  font-size: clamp(36px, 5vw, 58px);
  letter-spacing: -.01em;
}
.hero-lead{
  font-size: 17px;
  color: var(--slate);
  max-width: 560px;
  margin: 18px 0 32px;
}
.hero-ctas{ display:flex; align-items:center; gap: 22px; margin-bottom: 44px; }

.hero-stats{
  display:flex; gap: 36px;
  padding-top: 28px;
  border-top: 1px solid var(--line);
}
.hero-stats strong{
  display:block;
  font-family: var(--font-mono);
  font-size: 24px;
  color: var(--ink);
}
.hero-stats span{ font-size: 13px; color: var(--slate-2); }

/* ---------- Logos strip ---------- */
.logos-strip{ padding: 32px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.logos-strip p{ text-align:center; font-size: 13px; color: var(--slate-2); margin: 0 0 18px; }
.logos-row{
  display:flex; justify-content:center; gap: 40px; flex-wrap:wrap;
  font-family: var(--font-display); font-size: 17px; color: var(--slate-2);
}

/* ---------- Sections ---------- */
.section{ padding: 92px 0; }

/* Systems */
.systems-grid{
  display:grid; grid-template-columns: 1fr 1fr; gap: 24px;
}
.system-card{
  padding: 40px;
  border-radius: var(--radius);
  background: #fff;
  border: 1px solid var(--line);
}
.system-card--dark{
  background: var(--ink);
  color: var(--paper);
  border-color: transparent;
}
.system-tag{
  display:inline-block;
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--paper-2);
  color: var(--slate);
  margin-bottom: 18px;
}
.system-card--dark .system-tag{ background: rgba(247,245,239,.1); color: var(--paper); }
.system-card h3{ font-size: 24px; }
.system-card p{ color: var(--slate); margin-bottom: 20px; }
.system-card--dark p{ color: rgba(247,245,239,.75); }
.system-card ul{ margin-bottom: 24px; display:flex; flex-direction:column; gap:10px; }
.system-card ul li{ font-size: 14.5px; padding-inline-start: 20px; position:relative; }
.system-card ul li::before{
  content:''; position:absolute; right:0; top:9px;
  width:6px; height:6px; border-radius:50%; background: var(--gold);
}
.link-arrow{ font-weight:600; font-size:14.5px; color: var(--teal-2); }
.system-card--dark .link-arrow{ color: var(--gold); }

/* How it works */
.howitworks{ background: var(--paper-2); }
.steps-row{
  display:grid; grid-template-columns: repeat(4,1fr); gap: 28px;
}
.step-glyph{
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--gold-2);
  display:block; margin-bottom: 14px;
}
.step h3{ font-size: 18.5px; }
.step p{ font-size: 14.5px; color: var(--slate); }

/* Features */
.features-grid{
  display:grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
}
.feature-card{
  padding: 28px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: #fff;
  transition: border-color .18s ease, transform .18s ease;
}
.feature-card:hover{ border-color: var(--teal); transform: translateY(-3px); }
.feature-card h3{ font-size: 17px; margin-bottom: 8px; }
.feature-card p{ font-size: 14px; color: var(--slate); margin:0; }

/* Video showcase */
.video-showcase{ background: var(--paper-2); }
.video-frame{
  max-width: 860px; margin: 0 auto;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--ink);
  aspect-ratio: 16/9;
}
.video-frame video{ width:100%; height:100%; display:block; object-fit: cover; }

/* CTA band */
.cta-band{
  background: var(--ink);
  color: var(--paper);
  padding: 76px 0;
}
.cta-inner{ text-align:center; }
.cta-inner h2{ font-size: clamp(26px,3.2vw,36px); color: var(--paper); }
.cta-inner p{ color: rgba(247,245,239,.7); margin-bottom: 28px; }
.cta-band .btn-solid{ background: var(--gold); color: #fff; }

/* ---------- Footer ---------- */
.site-footer{ background: var(--ink); color: var(--paper); padding-top: 60px; }
.footer-grid{
  display:grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 32px;
  padding-bottom: 48px;
  border-bottom: 1px solid var(--line-dark);
}
.footer-brand p{ color: rgba(247,245,239,.6); font-size:14px; margin-top:10px; max-width:260px; }
.footer-col h4{ font-family: var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:.04em; color: var(--slate-2); margin-bottom: 16px; }
.footer-col a{ display:block; font-size:14.5px; color: rgba(247,245,239,.8); margin-bottom: 12px; }
.footer-col a:hover{ color: var(--gold); }
.footer-bottom{ padding: 22px 28px; font-size:13px; color: var(--slate-2); }

/* ---------- Reveal on scroll ---------- */
.reveal{ opacity:0; transform: translateY(14px); transition: opacity .6s ease, transform .6s ease; }
.reveal.is-visible{ opacity:1; transform:none; }

/* ---------- Responsive ---------- */
@media (max-width: 980px){
  .main-nav{ display:none; }
  .nav-toggle{ display:flex; }
  .systems-grid{ grid-template-columns: 1fr; }
  .steps-row{ grid-template-columns: 1fr 1fr; }
  .features-grid{ grid-template-columns: 1fr 1fr; }
  .footer-grid{ grid-template-columns: 1fr 1fr; }
}
@media (max-width: 560px){
  .steps-row{ grid-template-columns: 1fr; }
  .features-grid{ grid-template-columns: 1fr; }
  .footer-grid{ grid-template-columns: 1fr; }
  .hero-stats{ flex-wrap:wrap; row-gap:16px; }
}

/* ---- community.css ---- */
.community-shell{ background: var(--paper-2); min-height: calc(100vh - 76px); padding: 32px 0 60px; }
.community-grid{
  display:grid;
  grid-template-columns: 220px 1fr 260px;
  gap: 24px;
  align-items:start;
}

.sidebar-card{
  background:#fff; border:1px solid var(--line); border-radius: var(--radius);
  padding: 18px; margin-bottom: 16px;
}
.sidebar-card h4{
  font-family: var(--font-mono); font-size:11.5px; text-transform:uppercase;
  letter-spacing:.04em; color: var(--slate-2); margin: 0 0 12px;
}
.filter-list, .tag-list{ display:flex; flex-direction:column; gap:4px; }
.filter-btn{
  width:100%; text-align:right;
  padding: 9px 10px; border-radius: 8px; border:none; background:transparent;
  font-family: var(--font-body); font-size: 14px; font-weight:500; color: var(--slate);
  cursor:pointer;
}
.filter-btn:hover{ background: var(--paper-2); }
.filter-btn.is-active{ background: var(--ink); color: var(--paper); }
.tag-list a{ display:block; padding: 7px 10px; border-radius:8px; font-size:14px; color: var(--slate); }
.tag-list a:hover{ background: var(--paper-2); color: var(--ink); }
.tag-list a.is-active{ background: var(--ink); color:#fff; }

.feed-search input{
  width:100%; padding: 13px 16px; border-radius: 999px;
  border:1px solid var(--line); background:#fff;
  font-family: var(--font-body); font-size:14.5px;
  margin-bottom: 18px;
}
.feed-search input:focus{ outline: 2px solid var(--teal); }

.idea-list{ display:flex; flex-direction:column; gap:14px; }

.idea-card{
  background:#fff; border:1px solid var(--line); border-radius: var(--radius);
  padding: 22px;
}
.idea-card-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.idea-avatar{
  width:34px; height:34px; border-radius:50%;
  background: var(--ink); color: var(--paper);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-mono); font-size:13px; flex-shrink:0;
}
.idea-meta{ font-size:13px; color: var(--slate-2); }
.idea-meta strong{ color: var(--ink); font-size:14px; }

.idea-card h3{ font-size:18px; margin: 0 0 6px; }
.idea-card p{ font-size:14.5px; color: var(--slate); margin: 0 0 14px; }

.idea-tag{
  display:inline-block; font-family: var(--font-mono); font-size:11.5px;
  padding: 3px 9px; border-radius:999px; background: var(--paper-2); color: var(--slate);
  margin-inline-end: 8px;
}

.idea-actions{ display:flex; gap:18px; margin-top: 14px; padding-top:14px; border-top:1px solid var(--line); }
.idea-action{
  display:flex; align-items:center; gap:6px;
  background:none; border:none; cursor:pointer;
  font-family: var(--font-body); font-size:13.5px; color: var(--slate);
}
.idea-action:hover{ color: var(--teal-2); }

.leaderboard{ margin:0; padding: 0; display:flex; flex-direction:column; gap:12px; list-style:none; counter-reset: rank; }
.leaderboard li{
  display:flex; align-items:center; gap:10px;
  font-size:13.5px; color: var(--slate);
  counter-increment: rank;
}
.leaderboard li::before{
  content: counter(rank);
  font-family: var(--font-mono); font-size:12px;
  width:20px; height:20px; border-radius:50%;
  background: var(--paper-2); color: var(--ink);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}

.avatar-link{ display:flex; }
.avatar{
  width:36px; height:36px; border-radius:50%;
  background: var(--gold); color: var(--ink);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-mono); font-weight:700;
}

.main-nav a.is-current{ color: var(--ink); font-weight:700; }

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; z-index: 100;
  background: rgba(11,18,38,.5);
  display:flex; align-items:center; justify-content:center;
  padding: 20px;
}
.modal-overlay[hidden]{ display:none; }
.modal-card{
  background:#fff; border-radius: var(--radius);
  width:100%; max-width: 520px;
  max-height: 88vh; overflow-y:auto;
  padding: 28px;
}
.modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 18px; }
.modal-head h2{ font-size:22px; margin:0; }
.modal-close{
  background:none; border:none; font-size:26px; line-height:1; cursor:pointer;
  color: var(--slate); padding:4px;
}

.idea-form{ display:flex; flex-direction:column; gap:16px; }
.idea-form label{ display:flex; flex-direction:column; gap:6px; font-size:13.5px; font-weight:600; color: var(--ink); }
.idea-form label[hidden]{ display:none; }
.idea-form input, .idea-form select, .idea-form textarea{
  font-family: var(--font-body); font-size: 14.5px; font-weight:400;
  padding: 11px 14px; border-radius: 10px; border:1px solid var(--line);
  background: var(--paper); color: var(--ink); resize: vertical;
}
.idea-form-row{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
.file-drop{
  border: 1.5px dashed var(--line); border-radius:10px;
  padding: 16px; text-align:center; cursor:pointer;
  font-weight:400 !important; font-size:13.5px !important; color: var(--slate-2) !important;
}
.file-drop input{ display:block; margin-top:8px; width:100%; }

.modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:4px; }

@media (max-width: 980px){
  .community-grid{ grid-template-columns: 1fr; }
  .community-sidebar, .community-rail{ display:none; }
  .idea-form-row{ grid-template-columns: 1fr; }
}

</style>
</head>
<body>
<div id="google_translate_element" class="lang-switcher-wrap" aria-label="تغيير اللغة"></div>


<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="30" height="30">
          <circle cx="8" cy="20" r="4" fill="var(--gold)"/>
          <path d="M12 20 L22 20" stroke="var(--teal)" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/>
          <path d="M22 20 L32 10 M22 20 L32 20 M22 20 L32 30" stroke="var(--teal)" stroke-width="2" fill="none" stroke-linecap="round"/>
          <circle cx="32" cy="10" r="2.5" fill="var(--violet)"/>
          <circle cx="32" cy="20" r="2.5" fill="var(--violet)"/>
          <circle cx="32" cy="30" r="2.5" fill="var(--violet)"/>
        </svg>
      </span>
      <span class="brand-name">Innovation<span class="brand-accent">Grid</span></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">الرئيسية</a>
      <a href="community.html" class="is-current">مجتمع المبتكرين</a>
      <a href="challenges.html">التحديات</a>
      <a href="dashboard.html">لوحتي</a>
    </nav>
    <div class="header-actions">
      <button class="btn btn-solid" id="openIdeaModal">+ فكرة جديدة</button>
      <a href="profile.html" class="avatar-link" title="حسابي">
        <span class="avatar">م</span>
      </a>
    </div>
  </div>
</header>

<main class="community-shell">
  <div class="wrap community-grid">

    <!-- Sidebar -->
    <aside class="community-sidebar">
      <div class="sidebar-card">
        <h4>تصفح حسب</h4>
        <ul class="filter-list" id="filterList">
          <li><button class="filter-btn is-active" data-filter="trending">الأكثر انتشارًا</button></li>
          <li><button class="filter-btn" data-filter="latest">الأحدث</button></li>
          <li><button class="filter-btn" data-filter="followed">اللي بتابعهم</button></li>
          <li><button class="filter-btn" data-filter="saved">المحفوظة</button></li>
        </ul>
      </div>
      <div class="sidebar-card">
        <h4>التصنيفات</h4>
        <ul class="tag-list" id="tagList">
          <li><a href="#" data-tag="تقنية">تقنية</a></li>
          <li><a href="#" data-tag="استدامة">استدامة</a></li>
          <li><a href="#" data-tag="تعليم">تعليم</a></li>
          <li><a href="#" data-tag="صحة">صحة</a></li>
          <li><a href="#" data-tag="خدمات حكومية">خدمات حكومية</a></li>
        </ul>
      </div>
    </aside>

    <!-- Feed -->
    <section class="community-feed">
      <div class="feed-search">
        <input type="search" placeholder="ابحث في الأفكار…" id="ideaSearch">
      </div>

      <div class="idea-list" id="ideaList">
        <!-- Cards injected by community.js -->
      </div>
    </section>

    <!-- Right rail -->
    <aside class="community-rail">
      <div class="sidebar-card">
        <h4>الأكثر تفاعلًا هذا الأسبوع</h4>
        <ol class="leaderboard" id="leaderboardList"></ol>
      </div>
    </aside>

  </div>
</main>

<!-- Submit idea modal -->
<div class="modal-overlay" id="ideaModalOverlay" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="ideaModalTitle">
    <div class="modal-head">
      <h2 id="ideaModalTitle">شارك فكرتك</h2>
      <button class="modal-close" id="closeIdeaModal" aria-label="إغلاق">×</button>
    </div>
    <form id="ideaForm" class="idea-form">
      <label>
        <span>عنوان الفكرة</span>
        <input type="text" name="title" required placeholder="عنوان مختصر وواضح">
      </label>
      <label>
        <span>وصف الفكرة</span>
        <textarea name="description" rows="4" required placeholder="اشرح الفكرة، المشكلة اللي بتحلها، والفايدة منها"></textarea>
      </label>
      <div class="idea-form-row">
        <label>
          <span>التصنيف</span>
          <select name="category">
            <option>تقنية</option>
            <option>استدامة</option>
            <option>تعليم</option>
            <option>صحة</option>
            <option>خدمات حكومية</option>
          </select>
        </label>
        <label>
          <span>الظهور</span>
          <select name="visibility">
            <option value="public">عامة — تظهر في المجتمع</option>
            <option value="private">خاصة — تفضل عندي بس</option>

        </label>
      </div>
      <label id="departmentField" hidden>
        <span>الإدارة (لو بتقدّمي الفكرة كموظفة في شركة)</span>
        <select name="department">
          <option value="">بدون إدارة محددة</option>
          <option>تقنية المعلومات</option>
          <option>الموارد البشرية</option>
          <option>العمليات</option>
          <option>المشتريات</option>
          <option>المرافق</option>
          <option>أخرى</option>

      </label>
      <label class="file-drop">
        <span>إرفاق ملفات أو صور (اختياري)</span>

        <button type="submit" class="btn btn-solid">نشر الفكرة</button>

<script>
  const API_BASE = 'https://innovation-grid-api.rowanhamdi87.workers.dev';
</script>

<script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({ pageLanguage: 'ar', autoDisplay: false }, 'google_translate_element');
  }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
<script>

/* ---- main.js ---- */
// Innovation Grid — plain JS, no build step, works directly on GitHub Pages

// Mobile nav toggle
const navToggle = document.getElementById('navToggle');
const mainNav = document.getElementById('mainNav');
if (navToggle && mainNav) {
  navToggle.addEventListener('click', () => {
    const isOpen = mainNav.classList.toggle('is-open');
    navToggle.setAttribute('aria-expanded', String(isOpen));
  });
}

// Scroll reveal for sections
const revealTargets = document.querySelectorAll(
  '.system-card, .step, .feature-card, .section-title, .hero-copy'
);
revealTargets.forEach((el) => el.classList.add('reveal'));

const observer = new IntersectionObserver(
  (entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    });
  },
  { threshold: 0.15 }
);
revealTargets.forEach((el) => observer.observe(el));

// Company welcome video — show the section only if the logged-in user's
// company has set one. Anonymous visitors see no video (no company context
// exists yet for anonymous visitors without a slug/subdomain per company).
(async function renderCompanyVideo() {
  const section = document.getElementById('videoShowcaseSection');
  const frame = document.getElementById('videoShowcaseFrame');
  if (!section || !frame) return;

  const loggedInUser = JSON.parse(localStorage.getItem('ig_user') || 'null');
  if (!loggedInUser?.companyId) { section.hidden = true; return; }

  try {
    const res = await fetch(`${API_BASE}/company/${loggedInUser.companyId}`);
    const company = await res.json();
    const url = company['Intro Video URL'];
    if (!url) { section.hidden = true; return; }

    let embedUrl = url;
    try {
      const u = new URL(url);
      if (u.hostname.includes('youtube.com') && u.searchParams.get('v')) {
        embedUrl = `https://www.youtube.com/embed/${u.searchParams.get('v')}`;
      } else if (u.hostname === 'youtu.be') {
        embedUrl = `https://www.youtube.com/embed/${u.pathname.slice(1)}`;
      } else if (u.hostname.includes('drive.google.com')) {
        embedUrl = url.replace('/view', '/preview');
      }
    } catch { /* leave embedUrl as-is */ }

    frame.innerHTML = `<iframe src="${embedUrl}" allowfullscreen style="width:100%;height:100%;border:0;"></iframe>`;
    section.hidden = false;
  } catch {
    section.hidden = true;
  }
})();

/* ---- community.js ---- */
// Innovation Grid — community feed logic (live data via the Worker)

const LOGGED_IN_USER = JSON.parse(localStorage.getItem('ig_user') || 'null');

let ALL_IDEAS = [];
const ideaList = document.getElementById('ideaList');
let activeTag = null;

async function loadCommunityIdeas() {
  try {
    const res = await fetch(`${API_BASE}/ideas`);
    const data = await res.json();
    ALL_IDEAS = (data.records || []).filter((i) => i.Visibility === 'Public');
    renderIdeaList();
    renderLeaderboard();
  } catch {
    if (ideaList) ideaList.innerHTML = `<p style="color:#B42318;">تعذّر تحميل الأفكار.</p>`;
  }
}

function ideaCardHTML(idea) {
  return `
    <article class="idea-card">
      <div class="idea-card-head">
        <span class="idea-avatar">م</span>
        <div class="idea-meta"><strong>عضو المجتمع</strong><br>—</div>
      </div>
      <h3>${idea.Title || '—'}</h3>
      <p>${idea.Description || ''}</p>
      <div class="idea-actions">
        <button class="idea-action">♡ 0</button>
        <button class="idea-action">💬 0</button>
        <button class="idea-action">↗ مشاركة</button>
        <button class="idea-action">⭑ 0</button>
      </div>
    </article>
  `;
}

function renderIdeaList() {
  const q = (document.getElementById('ideaSearch')?.value || '').trim().toLowerCase();
  const filtered = ALL_IDEAS.filter((idea) => !q || (idea.Title || '').toLowerCase().includes(q) || (idea.Description || '').toLowerCase().includes(q));

  ideaList.innerHTML = filtered.length
    ? filtered.map(ideaCardHTML).join('')
    : `<p style="color:var(--slate-2);">لا توجد أفكار مطابقة بعد — كوني أول من يشارك فكرة!</p>`;
}

function renderLeaderboard() {
  const leaderboardList = document.getElementById('leaderboardList');
  if (!leaderboardList) return;
  leaderboardList.innerHTML = ALL_IDEAS.slice(0, 5)
    .map((idea) => `<li>${(idea.Title || '').slice(0, 34)}</li>`)
    .join('') || `<li style="color:var(--slate-2);">لسه مفيش أفكار.</li>`;
}

if (ideaList) loadCommunityIdeas();

document.getElementById('ideaSearch')?.addEventListener('input', renderIdeaList);

// Sidebar filters (Trending/Latest work on the real feed; Followed/Saved need
// a following/saves relation that doesn't exist in Airtable yet)
document.querySelectorAll('#filterList .filter-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#filterList .filter-btn').forEach((b) => b.classList.remove('is-active'));
    btn.classList.add('is-active');
    const mode = btn.dataset.filter;
    if (mode === 'followed' || mode === 'saved') {
      ideaList.innerHTML = `<p style="color:var(--slate-2);">ميزة "${btn.textContent}" لسه مش متاحة، هتتفعّل قريبًا.</p>`;
    } else {
      renderIdeaList();
    }
  });
});

document.querySelectorAll('#tagList a').forEach((tagLink) => {
  tagLink.addEventListener('click', (e) => {
    e.preventDefault();
    // NOTE: category/tag filtering needs a Category field on Ideas, which
    // doesn't exist in Airtable yet — visual toggle only for now.
    document.querySelectorAll('#tagList a').forEach((a) => a.classList.remove('is-active'));
    tagLink.classList.toggle('is-active');
  });
});

// ---- Submit idea modal ----
const overlay = document.getElementById('ideaModalOverlay');
const openBtn = document.getElementById('openIdeaModal');
const closeBtn = document.getElementById('closeIdeaModal');
const cancelBtn = document.getElementById('cancelIdeaModal');

function openModal() {
  if (!LOGGED_IN_USER) {
    alert('سجّلي دخولك الأول عشان تقدري تشاركي فكرة.');
    window.location.href = 'login.html';
    return;
  }
  const deptField = document.getElementById('departmentField');
  if (deptField) deptField.hidden = !LOGGED_IN_USER.companyId;
  overlay.hidden = false;
}
function closeModal() { overlay.hidden = true; }

if (openBtn) openBtn.addEventListener('click', openModal);
if (closeBtn) closeBtn.addEventListener('click', closeModal);
if (cancelBtn) cancelBtn.addEventListener('click', closeModal);
if (overlay) overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

const ideaForm = document.getElementById('ideaForm');
const ideaFormMsg = document.getElementById('ideaFormMsg');
if (ideaForm) {
  ideaForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(ideaForm));
    try {
      await fetch(`${API_BASE}/ideas`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: data.title,
          description: data.description,
          visibility: data.visibility === 'private' ? 'Private' : 'Public',
          companyId: LOGGED_IN_USER?.companyId || undefined,
          ownerId: LOGGED_IN_USER?.id,
          department: data.department || undefined,
        }),
      });
      ideaFormMsg.textContent = 'تم نشر فكرتك بنجاح!';
      ideaFormMsg.className = 'form-msg success';
      ideaForm.reset();
      loadCommunityIdeas();
    } catch {
      ideaFormMsg.textContent = 'تعذّر نشر الفكرة.';
      ideaFormMsg.className = 'form-msg error';
    }
  });
}

</script>
