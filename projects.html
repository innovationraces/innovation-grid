<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المشاريع — Innovation Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">



<style>

/* ---- style.css ---- */
/* ==========================================================
   Innovation Grid — Design tokens (professional / enterprise SaaS)
   Palette: Slate Ink / near-white Paper / Corporate Blue / Teal / Indigo
   Type: IBM Plex Sans Arabic throughout (display + body), IBM Plex Mono for data
   ========================================================== */

:root{
  --ink:      #0F172A;
  --ink-2:    #1E293B;
  --paper:    #FFFFFF;
  --paper-2:  #F4F6F9;
  --gold:     #2563EB;   /* primary brand blue */
  --gold-2:   #1D4ED8;   /* primary blue, darker */
  --teal:     #0E9384;
  --teal-2:   #0C7A6B;
  --violet:   #4F46E5;
  --slate:    #475467;
  --slate-2:  #94A3B8;
  --line:     #E2E8F0;
  --line-dark:rgba(248,250,252,0.14);

  --font-display: 'IBM Plex Sans Arabic', sans-serif;
  --font-body: 'IBM Plex Sans Arabic', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;

  --radius: 10px;
  --wrap: 1180px;
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img{ max-width:100%; display:block; }
a{ color: inherit; text-decoration:none; }
ul{ margin:0; padding:0; list-style:none; }

.wrap{
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 0 28px;
}

h1,h2,h3{
  font-family: var(--font-display);
  font-weight: 600;
  line-height: 1.15;
  margin: 0 0 .5em;
}

.eyebrow{
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: .04em;
  color: var(--gold-2);
  text-transform: uppercase;
  margin: 0 0 12px;
}
.eyebrow.center{ text-align:center; }
.section-title{ font-size: clamp(26px, 3.4vw, 40px); }
.section-title.center{ text-align:center; max-width: 640px; margin-inline:auto; margin-bottom: 52px; }

.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding: 12px 22px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 14.5px;
  border: 1px solid transparent;
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  white-space: nowrap;
}
.btn-solid{
  background: var(--ink);
  color: var(--paper);
}
.btn-solid:hover{ transform: translateY(-2px); box-shadow: 0 10px 24px rgba(11,18,38,.22); }
.btn-ghost{
  background: transparent;
  color: var(--ink);
  border-color: var(--line);
}
.btn-ghost:hover{ background: var(--paper-2); }
.btn-text{ font-weight:600; color: var(--teal-2); }
.btn-lg{ padding: 14px 28px; font-size: 15.5px; }

/* ---------- Header ---------- */
.site-header{
  position: sticky; top:0; z-index: 50;
  background: rgba(247,245,239,.86);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.header-inner{
  display:flex; align-items:center; justify-content:space-between;
  height: 76px;
  gap: 24px;
}
.brand{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
.brand-mark circle{ animation: brandPulse 2.4s ease-in-out infinite; }
.brand-mark circle:nth-child(2){ animation-delay:.25s; }
.brand-mark circle:nth-child(3){ animation-delay:.5s; }
@keyframes brandPulse{
  0%, 100%{ opacity:1; }
  50%{ opacity:.5; }
}
@media (prefers-reduced-motion: reduce){
  .brand-mark circle{ animation:none; }
}
.brand-name{
  font-family: var(--font-display);
  font-size: 20px; font-weight:600;
  letter-spacing: -.01em;
}
.brand-accent{ color: var(--teal); }

.main-nav{ display:flex; gap: 28px; }
.main-nav a{ font-size: 14.5px; font-weight:500; color: var(--slate); }
.main-nav a:hover{ color: var(--ink); }

.header-actions{ display:flex; align-items:center; gap: 12px; }

.nav-toggle{
  display:none;
  flex-direction:column; gap:5px;
  background:none; border:none; cursor:pointer; padding:6px;
}
.nav-toggle span{ width:22px; height:2px; background: var(--ink); display:block; }

/* ---------- Hero ---------- */
.hero{ padding: 76px 0 40px; overflow: hidden; }
.hero-inner{
  display:block;
  max-width: 720px;
}
.hero h1{
  font-size: clamp(36px, 5vw, 58px);
  letter-spacing: -.01em;
}
.hero-lead{
  font-size: 17px;
  color: var(--slate);
  max-width: 560px;
  margin: 18px 0 32px;
}
.hero-ctas{ display:flex; align-items:center; gap: 22px; margin-bottom: 44px; }

.hero-stats{
  display:flex; gap: 36px;
  padding-top: 28px;
  border-top: 1px solid var(--line);
}
.hero-stats strong{
  display:block;
  font-family: var(--font-mono);
  font-size: 24px;
  color: var(--ink);
}
.hero-stats span{ font-size: 13px; color: var(--slate-2); }

/* ---------- Logos strip ---------- */
.logos-strip{ padding: 32px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.logos-strip p{ text-align:center; font-size: 13px; color: var(--slate-2); margin: 0 0 18px; }
.logos-row{
  display:flex; justify-content:center; gap: 40px; flex-wrap:wrap;
  font-family: var(--font-display); font-size: 17px; color: var(--slate-2);
}

/* ---------- Sections ---------- */
.section{ padding: 92px 0; }

/* Systems */
.systems-grid{
  display:grid; grid-template-columns: 1fr 1fr; gap: 24px;
}
.system-card{
  padding: 40px;
  border-radius: var(--radius);
  background: #fff;
  border: 1px solid var(--line);
}
.system-card--dark{
  background: var(--ink);
  color: var(--paper);
  border-color: transparent;
}
.system-tag{
  display:inline-block;
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--paper-2);
  color: var(--slate);
  margin-bottom: 18px;
}
.system-card--dark .system-tag{ background: rgba(247,245,239,.1); color: var(--paper); }
.system-card h3{ font-size: 24px; }
.system-card p{ color: var(--slate); margin-bottom: 20px; }
.system-card--dark p{ color: rgba(247,245,239,.75); }
.system-card ul{ margin-bottom: 24px; display:flex; flex-direction:column; gap:10px; }
.system-card ul li{ font-size: 14.5px; padding-inline-start: 20px; position:relative; }
.system-card ul li::before{
  content:''; position:absolute; right:0; top:9px;
  width:6px; height:6px; border-radius:50%; background: var(--gold);
}
.link-arrow{ font-weight:600; font-size:14.5px; color: var(--teal-2); }
.system-card--dark .link-arrow{ color: var(--gold); }

/* How it works */
.howitworks{ background: var(--paper-2); }
.steps-row{
  display:grid; grid-template-columns: repeat(4,1fr); gap: 28px;
}
.step-glyph{
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--gold-2);
  display:block; margin-bottom: 14px;
}
.step h3{ font-size: 18.5px; }
.step p{ font-size: 14.5px; color: var(--slate); }

/* Features */
.features-grid{
  display:grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
}
.feature-card{
  padding: 28px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: #fff;
  transition: border-color .18s ease, transform .18s ease;
}
.feature-card:hover{ border-color: var(--teal); transform: translateY(-3px); }
.feature-card h3{ font-size: 17px; margin-bottom: 8px; }
.feature-card p{ font-size: 14px; color: var(--slate); margin:0; }

/* Video showcase */
.video-showcase{ background: var(--paper-2); }
.video-frame{
  max-width: 860px; margin: 0 auto;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--ink);
  aspect-ratio: 16/9;
}
.video-frame video{ width:100%; height:100%; display:block; object-fit: cover; }

/* CTA band */
.cta-band{
  background: var(--ink);
  color: var(--paper);
  padding: 76px 0;
}
.cta-inner{ text-align:center; }
.cta-inner h2{ font-size: clamp(26px,3.2vw,36px); color: var(--paper); }
.cta-inner p{ color: rgba(247,245,239,.7); margin-bottom: 28px; }
.cta-band .btn-solid{ background: var(--gold); color: #fff; }

/* ---------- Footer ---------- */
.site-footer{ background: var(--ink); color: var(--paper); padding-top: 60px; }
.footer-grid{
  display:grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 32px;
  padding-bottom: 48px;
  border-bottom: 1px solid var(--line-dark);
}
.footer-brand p{ color: rgba(247,245,239,.6); font-size:14px; margin-top:10px; max-width:260px; }
.footer-col h4{ font-family: var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:.04em; color: var(--slate-2); margin-bottom: 16px; }
.footer-col a{ display:block; font-size:14.5px; color: rgba(247,245,239,.8); margin-bottom: 12px; }
.footer-col a:hover{ color: var(--gold); }
.footer-bottom{ padding: 22px 28px; font-size:13px; color: var(--slate-2); }

/* ---------- Reveal on scroll ---------- */
.reveal{ opacity:0; transform: translateY(14px); transition: opacity .6s ease, transform .6s ease; }
.reveal.is-visible{ opacity:1; transform:none; }

/* ---------- Responsive ---------- */
@media (max-width: 980px){
  .main-nav{ display:none; }
  .nav-toggle{ display:flex; }
  .systems-grid{ grid-template-columns: 1fr; }
  .steps-row{ grid-template-columns: 1fr 1fr; }
  .features-grid{ grid-template-columns: 1fr 1fr; }
  .footer-grid{ grid-template-columns: 1fr 1fr; }
}
@media (max-width: 560px){
  .steps-row{ grid-template-columns: 1fr; }
  .features-grid{ grid-template-columns: 1fr; }
  .footer-grid{ grid-template-columns: 1fr; }
  .hero-stats{ flex-wrap:wrap; row-gap:16px; }
}

/* ---- dashboard.css ---- */
.dash-shell{ display:flex; min-height:100vh; background: var(--paper-2); }

/* Sidebar */
.dash-sidebar{
  width: 240px; flex-shrink:0;
  background: var(--ink); color: var(--paper);
  display:flex; flex-direction:column;
  padding: 22px 16px;
  position: sticky; top:0; height:100vh;
}
.dash-brand{ padding: 0 8px 26px; }
.dash-brand .brand-name{ color: var(--paper); font-size:17px; }

.dash-nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
.dash-nav-link{
  display:flex; align-items:center; gap:10px;
  padding: 10px 12px; border-radius:8px;
  font-size:14px; font-weight:500;
  color: rgba(247,245,239,.75);
}
.dash-nav-link:hover{ background: rgba(247,245,239,.06); color:#fff; }
.dash-nav-link.is-active{ background: var(--gold); color:#fff; font-weight:600; }
.dash-nav-icon{ width:18px; text-align:center; font-size:14px; opacity:.9; }

.dash-sidebar-foot{
  display:flex; flex-direction:column; gap:2px;
  border-top: 1px solid var(--line-dark);
  padding-top: 12px;
}

/* Main */
.dash-main{ flex:1; min-width:0; }

.dash-topbar{
  background:#fff; border-bottom: 1px solid var(--line);
  padding: 18px 32px;
  display:flex; align-items:center; justify-content:space-between;
  position: sticky; top:0; z-index: 10;
}
.dash-company-tag{
  font-family: var(--font-mono); font-size:11.5px; color: var(--slate-2);
  text-transform:uppercase; letter-spacing:.03em; margin:0 0 4px;
}
.dash-topbar h1{ font-size:22px; margin:0; }
.dash-topbar-actions{ display:flex; align-items:center; gap:10px; }

.wrap-dash{ max-width: 1180px; margin:0 auto; padding: 28px 32px 60px; }

/* KPI cards */
.kpi-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:16px; margin-bottom: 24px; }
.kpi-card{
  background:#fff; border:1px solid var(--line); border-radius: var(--radius);
  padding: 20px; display:flex; flex-direction:column; gap:6px;
}
.kpi-label{ font-size:13px; color: var(--slate-2); }
.kpi-value{ font-family: var(--font-mono); font-size:28px; color: var(--ink); }
.kpi-delta{ font-size:12.5px; color: var(--slate-2); }
.kpi-delta.up{ color: var(--teal-2); }
.kpi-delta.down{ color: var(--gold-2); }

/* Columns */
.dash-columns{ display:grid; grid-template-columns: 1fr 320px; gap: 20px; align-items:start; }

.dash-panel{
  background:#fff; border:1px solid var(--line); border-radius: var(--radius);
  padding: 22px; margin-bottom: 18px;
}
.dash-panel h3{ font-size:15px; margin:0 0 16px; }
.dash-panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; }
.dash-panel-head h3{ margin:0; }

/* Table */
.dash-table{ width:100%; border-collapse: collapse; font-size:13.5px; }
.dash-table th{
  text-align: right; font-weight:600; color: var(--slate-2);
  font-size:12px; text-transform:uppercase; letter-spacing:.02em;
  padding: 8px 6px; border-bottom: 1px solid var(--line);
}
.dash-table td{ padding: 12px 6px; border-bottom: 1px solid var(--line); color: var(--ink); }
.dash-table tr:last-child td{ border-bottom:none; }

.status-pill{
  display:inline-block; font-size:11.5px; padding: 3px 9px; border-radius:999px;
  font-family: var(--font-mono);
}
.status-pill.approved{ background:#ECFDF3; color:#067647; }
.status-pill.review{ background:#FFF6E5; color:#B54708; }
.status-pill.rejected{ background:#FEF3F2; color:#B42318; }

/* Challenge mini list */
.dash-challenge-list{ display:flex; flex-direction:column; gap:12px; }
.dash-challenge-row{
  display:flex; align-items:center; justify-content:space-between;
  padding: 12px 14px; background: var(--paper-2); border-radius:10px;
}
.dash-challenge-row strong{ font-size:14px; display:block; margin-bottom:3px; }
.dash-challenge-row span{ font-size:12.5px; color: var(--slate-2); }
.dash-challenge-row .count{ font-family: var(--font-mono); font-size:13px; color: var(--ink); }

/* Rank list */
.rank-list{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:12px; }
.rank-list li{ display:flex; align-items:center; justify-content:space-between; font-size:13.5px; }
.rank-list li span:last-child{ font-family: var(--font-mono); color: var(--slate-2); font-size:12.5px; }

/* Status bars */
.status-bars{ display:flex; flex-direction:column; gap:12px; }
.status-bar-row{ display:flex; flex-direction:column; gap:5px; }
.status-bar-row .bar-label{ display:flex; justify-content:space-between; font-size:12.5px; color: var(--slate); }
.status-bar-track{ height:6px; border-radius:999px; background: var(--paper-2); overflow:hidden; }
.status-bar-fill{ height:100%; border-radius:999px; }

/* Video management panel */
.panel-hint{ font-size:12.5px; color: var(--slate-2); margin: -8px 0 14px; }
.video-manage-form{ gap:12px !important; }
.video-manage-actions{ display:flex; justify-content:space-between; gap:10px; }
.video-current-frame{
  border-radius:10px; overflow:hidden; margin-bottom:14px;
  aspect-ratio:16/9; background: var(--ink);
}
.video-current-frame iframe, .video-current-frame video{ width:100%; height:100%; border:0; display:block; }
.video-empty-note{ font-size:12.5px; color: var(--slate-2); margin: 0 0 14px; }

@media (max-width: 1080px){
  .dash-columns{ grid-template-columns: 1fr; }
  .kpi-grid{ grid-template-columns: 1fr 1fr; }
}
@media (max-width: 720px){
  .dash-sidebar{ display:none; }
  .kpi-grid{ grid-template-columns: 1fr; }
  .wrap-dash{ padding: 20px 16px 48px; }
}

/* ---- community.css ---- */
.community-shell{ background: var(--paper-2); min-height: calc(100vh - 76px); padding: 32px 0 60px; }
.community-grid{
  display:grid;
  grid-template-columns: 220px 1fr 260px;
  gap: 24px;
  align-items:start;
}

.sidebar-card{
  background:#fff; border:1px solid var(--line); border-radius: var(--radius);
  padding: 18px; margin-bottom: 16px;
}
.sidebar-card h4{
  font-family: var(--font-mono); font-size:11.5px; text-transform:uppercase;
  letter-spacing:.04em; color: var(--slate-2); margin: 0 0 12px;
}
.filter-list, .tag-list{ display:flex; flex-direction:column; gap:4px; }
.filter-btn{
  width:100%; text-align:right;
  padding: 9px 10px; border-radius: 8px; border:none; background:transparent;
  font-family: var(--font-body); font-size: 14px; font-weight:500; color: var(--slate);
  cursor:pointer;
}
.filter-btn:hover{ background: var(--paper-2); }
.filter-btn.is-active{ background: var(--ink); color: var(--paper); }
.tag-list a{ display:block; padding: 7px 10px; border-radius:8px; font-size:14px; color: var(--slate); }
.tag-list a:hover{ background: var(--paper-2); color: var(--ink); }

.feed-search input{
  width:100%; padding: 13px 16px; border-radius: 999px;
  border:1px solid var(--line); background:#fff;
  font-family: var(--font-body); font-size:14.5px;
  margin-bottom: 18px;
}
.feed-search input:focus{ outline: 2px solid var(--teal); }

.idea-list{ display:flex; flex-direction:column; gap:14px; }

.idea-card{
  background:#fff; border:1px solid var(--line); border-radius: var(--radius);
  padding: 22px;
}
.idea-card-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.idea-avatar{
  width:34px; height:34px; border-radius:50%;
  background: var(--ink); color: var(--paper);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-mono); font-size:13px; flex-shrink:0;
}
.idea-meta{ font-size:13px; color: var(--slate-2); }
.idea-meta strong{ color: var(--ink); font-size:14px; }

.idea-card h3{ font-size:18px; margin: 0 0 6px; }
.idea-card p{ font-size:14.5px; color: var(--slate); margin: 0 0 14px; }

.idea-tag{
  display:inline-block; font-family: var(--font-mono); font-size:11.5px;
  padding: 3px 9px; border-radius:999px; background: var(--paper-2); color: var(--slate);
  margin-inline-end: 8px;
}

.idea-actions{ display:flex; gap:18px; margin-top: 14px; padding-top:14px; border-top:1px solid var(--line); }
.idea-action{
  display:flex; align-items:center; gap:6px;
  background:none; border:none; cursor:pointer;
  font-family: var(--font-body); font-size:13.5px; color: var(--slate);
}
.idea-action:hover{ color: var(--teal-2); }

.leaderboard{ margin:0; padding: 0; display:flex; flex-direction:column; gap:12px; list-style:none; counter-reset: rank; }
.leaderboard li{
  display:flex; align-items:center; gap:10px;
  font-size:13.5px; color: var(--slate);
  counter-increment: rank;
}
.leaderboard li::before{
  content: counter(rank);
  font-family: var(--font-mono); font-size:12px;
  width:20px; height:20px; border-radius:50%;
  background: var(--paper-2); color: var(--ink);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}

.avatar-link{ display:flex; }
.avatar{
  width:36px; height:36px; border-radius:50%;
  background: var(--gold); color: var(--ink);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-mono); font-weight:700;
}

.main-nav a.is-current{ color: var(--ink); font-weight:700; }

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; z-index: 100;
  background: rgba(11,18,38,.5);
  display:flex; align-items:center; justify-content:center;
  padding: 20px;
}
.modal-overlay[hidden]{ display:none; }
.modal-card{
  background:#fff; border-radius: var(--radius);
  width:100%; max-width: 520px;
  max-height: 88vh; overflow-y:auto;
  padding: 28px;
}
.modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 18px; }
.modal-head h2{ font-size:22px; margin:0; }
.modal-close{
  background:none; border:none; font-size:26px; line-height:1; cursor:pointer;
  color: var(--slate); padding:4px;
}

.idea-form{ display:flex; flex-direction:column; gap:16px; }
.idea-form label{ display:flex; flex-direction:column; gap:6px; font-size:13.5px; font-weight:600; color: var(--ink); }
.idea-form input, .idea-form select, .idea-form textarea{
  font-family: var(--font-body); font-size: 14.5px; font-weight:400;
  padding: 11px 14px; border-radius: 10px; border:1px solid var(--line);
  background: var(--paper); color: var(--ink); resize: vertical;
}
.idea-form-row{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
.file-drop{
  border: 1.5px dashed var(--line); border-radius:10px;
  padding: 16px; text-align:center; cursor:pointer;
  font-weight:400 !important; font-size:13.5px !important; color: var(--slate-2) !important;
}
.file-drop input{ display:block; margin-top:8px; width:100%; }

.modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:4px; }

@media (max-width: 980px){
  .community-grid{ grid-template-columns: 1fr; }
  .community-sidebar, .community-rail{ display:none; }
  .idea-form-row{ grid-template-columns: 1fr; }
}

/* ---- projects.css ---- */
.projects-filters{ display:flex; gap:8px; margin-bottom: 20px; flex-wrap:wrap; }
.projects-filters .filter-btn{
  width:auto; padding: 8px 16px; border-radius: 999px;
  background:#fff; border:1px solid var(--line); font-size:13.5px;
}
.projects-filters .filter-btn.is-active{ background: var(--ink); color:#fff; border-color: var(--ink); }

.project-list{ display:flex; flex-direction:column; gap:14px; }

.project-row{
  background:#fff; border:1px solid var(--line); border-radius: var(--radius);
  padding: 20px 22px;
  display:grid;
  grid-template-columns: 1.6fr 1fr 1fr 140px;
  gap: 20px;
  align-items:center;
}

.project-info h3{ font-size:16px; margin: 0 0 6px; }
.project-info span{ font-size:12.5px; color: var(--slate-2); }

.project-progress .bar-label{ display:flex; justify-content:space-between; font-size:12.5px; color: var(--slate); margin-bottom:6px; }
.project-progress .status-bar-track{ height:6px; border-radius:999px; background: var(--paper-2); overflow:hidden; }
.project-progress .status-bar-fill{ height:100%; border-radius:999px; background: var(--gold); }

.project-budget{ font-family: var(--font-mono); font-size:14px; color: var(--ink); }
.project-budget span{ display:block; font-family: var(--font-body); font-size:11.5px; color: var(--slate-2); margin-top:2px; }

.project-status-pill{
  justify-self: start;
  font-size:11.5px; font-family: var(--font-mono);
  padding: 4px 12px; border-radius:999px; white-space:nowrap;
}
.project-status-pill.planning{ background:#EEF4FF; color:#3538CD; }
.project-status-pill.in-progress{ background:#FFF6E5; color:#B54708; }
.project-status-pill.completed{ background:#ECFDF3; color:#067647; }
.project-status-pill.on-hold{ background: var(--paper-2); color: var(--slate-2); }

@media (max-width: 860px){
  .project-row{ grid-template-columns: 1fr; align-items:start; }
}

</style>
</head>
<body>

<div class="dash-shell">

  <!-- Sidebar -->
  <aside class="dash-sidebar">
    <a href="index.html" class="brand dash-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="28" height="28">
          <circle cx="8" cy="20" r="4" fill="var(--gold)"/>
          <path d="M12 20 L22 20" stroke="var(--teal)" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/>
          <path d="M22 20 L32 10 M22 20 L32 20 M22 20 L32 30" stroke="var(--teal)" stroke-width="2" fill="none" stroke-linecap="round"/>

<!-- New project modal -->
<div class="modal-overlay" id="projectModalOverlay" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
    <div class="modal-head">
      <h2 id="projectModalTitle">مشروع جديد</h2>
      <button class="modal-close" id="closeProjectModal" aria-label="إغلاق">×</button>
    </div>
    <form id="projectForm" class="idea-form">
      <label>
        <span>اسم المشروع</span>
        <input type="text" name="name" required placeholder="اسم المشروع">
      </label>
      <label>
        <span>الفكرة أو الحل المصدر (اختياري)</span>
        <input type="text" name="source" placeholder="ابحث عن فكرة أو حل فائز">
      </label>
      <div class="idea-form-row">
        <label>
          <span>مدير المشروع</span>
          <input type="text" name="manager" placeholder="اسم مدير المشروع">
        </label>
        <label>
          <span>الميزانية (ريال)</span>
          <input type="number" name="budget" placeholder="0">
        </label>
      </div>

        <button type="submit" class="btn btn-solid">إنشاء المشروع</button>

    </form>
  </div>

<script>

/* ---- main.js ---- */
// Innovation Grid — plain JS, no build step, works directly on GitHub Pages

// Mobile nav toggle
const navToggle = document.getElementById('navToggle');
const mainNav = document.getElementById('mainNav');
if (navToggle && mainNav) {
  navToggle.addEventListener('click', () => {
    const isOpen = mainNav.classList.toggle('is-open');
    navToggle.setAttribute('aria-expanded', String(isOpen));
  });
}

// Scroll reveal for sections
const revealTargets = document.querySelectorAll(
  '.system-card, .step, .feature-card, .section-title, .hero-copy'
);
revealTargets.forEach((el) => el.classList.add('reveal'));

const observer = new IntersectionObserver(
  (entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    });
  },
  { threshold: 0.15 }
);
revealTargets.forEach((el) => observer.observe(el));

// Company welcome video — show the section only if a video URL is set
// NOTE: reads from localStorage for now (placeholder until wired to Airtable
// via the Worker); dashboard.js's "Company Video" panel writes this key.
(function renderCompanyVideo() {
  const section = document.getElementById('videoShowcaseSection');
  const frame = document.getElementById('videoShowcaseFrame');
  if (!section || !frame) return;

  const url = localStorage.getItem('ig_company_video_url');
  if (!url) {
    section.hidden = true;
    return;
  }

  let embedUrl = url;
  try {
    const u = new URL(url);
    if (u.hostname.includes('youtube.com') && u.searchParams.get('v')) {
      embedUrl = `https://www.youtube.com/embed/${u.searchParams.get('v')}`;
    } else if (u.hostname === 'youtu.be') {
      embedUrl = `https://www.youtube.com/embed/${u.pathname.slice(1)}`;
    } else if (u.hostname.includes('drive.google.com')) {
      embedUrl = url.replace('/view', '/preview');
    }
  } catch { /* leave embedUrl as-is */ }

  frame.innerHTML = `<iframe src="${embedUrl}" allowfullscreen style="width:100%;height:100%;border:0;"></iframe>`;
  section.hidden = false;
})();

/* ---- projects.js ---- */
// Innovation Grid — projects page logic
// NOTE: project data below is placeholder for layout/testing.
// Once the Cloudflare Worker + Airtable backend is wired, this will
// pull real records from the "Projects" table.

const PROJECTS = [
  {
    name: 'نظام حجز قاعات الاجتماعات الذكي',
    source: 'من فكرة: نظام حجز قاعات اجتماعات ذكي',
    status: 'in-progress',
    progress: 62,
    budget: '85,000',
    manager: 'خالد المطيري',
  },
  {
    name: 'منصة تدوير المستلزمات المكتبية',
    source: 'من فكرة: برنامج تدوير المستلزمات المكتبية',
    status: 'planning',
    progress: 12,
    budget: '40,000',
    manager: 'نورة القحطاني',
  },
  {
    name: 'حل خفض هدر مياه الري',
    source: 'من حل فائز: تحدي خفض هدر المياه',
    status: 'in-progress',
    progress: 45,
    budget: '150,000',
    manager: 'فهد العتيبي',
  },
  {
    name: 'إعادة تصميم رحلة تأهيل الموظف الجديد',
    source: 'من حل فائز: تحدي تحسين تجربة الموظف الجديد',
    status: 'completed',
    progress: 100,
    budget: '60,000',
    manager: 'سارة الدوسري',
  },
  {
    name: 'لوحة متابعة استهلاك الطاقة بالفروع',
    source: 'من فكرة: لوحة متابعة استهلاك الطاقة',
    status: 'on-hold',
    progress: 28,
    budget: '95,000',
    manager: 'عبدالله الشهري',
  },
];

const STATUS_LABEL = { planning: 'قيد التخطيط', 'in-progress': 'قيد التنفيذ', completed: 'مكتمل', 'on-hold': 'متوقف مؤقتًا' };

function projectRowHTML(p) {
  return `
    <div class="project-row" data-status="${p.status}">
      <div class="project-info">
        <h3>${p.name}</h3>
        <span>${p.source} — مدير المشروع: ${p.manager}</span>
      </div>
      <div class="project-progress">
        <div class="bar-label"><span>نسبة الإنجاز</span><span>${p.progress}%</span></div>
        <div class="status-bar-track"><div class="status-bar-fill" style="width:${p.progress}%;"></div></div>
      </div>
      <div class="project-budget">
        ${p.budget} ريال
        <span>الميزانية المعتمدة</span>
      </div>
      <span class="project-status-pill ${p.status}">${STATUS_LABEL[p.status]}</span>
    </div>
  `;
}

const list = document.getElementById('projectList');
let currentFilter = 'all';

function renderProjects() {
  const filtered = currentFilter === 'all' ? PROJECTS : PROJECTS.filter((p) => p.status === currentFilter);
  list.innerHTML = filtered.length
    ? filtered.map(projectRowHTML).join('')
    : `<p style="color:var(--slate-2);">لا توجد مشاريع في هذا التصنيف حاليًا.</p>`;
}

if (list) renderProjects();

document.querySelectorAll('.projects-filters .filter-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.projects-filters .filter-btn').forEach((b) => b.classList.remove('is-active'));
    btn.classList.add('is-active');
    currentFilter = btn.dataset.status;
    renderProjects();
  });
});

// New project modal
const overlay = document.getElementById('projectModalOverlay');
document.getElementById('openProjectModal')?.addEventListener('click', () => { overlay.hidden = false; });
document.getElementById('closeProjectModal')?.addEventListener('click', () => { overlay.hidden = true; });
document.getElementById('cancelProjectModal')?.addEventListener('click', () => { overlay.hidden = true; });
overlay?.addEventListener('click', (e) => { if (e.target === overlay) overlay.hidden = true; });

const projectForm = document.getElementById('projectForm');
const projectFormMsg = document.getElementById('projectFormMsg');
if (projectForm) {
  projectForm.addEventListener('submit', (e) => {
    e.preventDefault();
    projectFormMsg.textContent = 'سيتم إنشاء المشروع فعليًا عند ربط المنصة بقاعدة البيانات.';
    projectFormMsg.className = 'form-msg success';
  });
}

</script>
